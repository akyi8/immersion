# Builds Immersion for macOS and Windows on every push to main.
#
# With the update key in the repository's secrets, each build becomes a GitHub release
# whose files are signed with that key, and the app's updater installs it. Without the
# key, the builds are still made and attached to the workflow run as downloads.
name: Immersion build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: immersion-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  VERSION: 0.2.${{ github.run_number }}

jobs:
  # Creates a draft release first, so both platform builds add their files to one release.
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.result }}
      signed: ${{ steps.key.outputs.present }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: create
        if: steps.key.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              name: `Immersion ${process.env.VERSION}`,
              body: `Built from ${context.sha.slice(0, 7)}.`,
              target_commitish: context.sha,
              draft: true,
            });
            return data.id;

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            args: ''
            rust-targets: ''
            bundle: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Each build carries its run number in its version, so every download has a
      # distinct name and the app shows which build it is.
      - name: Stamp the version
        shell: bash
        env:
          SIGNED: ${{ needs.release.outputs.signed }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.env.VERSION;
            if (process.env.SIGNED !== "true") conf.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          '

      - name: Build, sign, and add to the release
        if: needs.release.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Build without publishing
        if: needs.release.outputs.signed != 'true'
        run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Immersion-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14

  # Publishes the release once both platforms have added their files, so the updater
  # never sees a release that is missing one of them.
  publish:
    needs: [release, build]
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });
