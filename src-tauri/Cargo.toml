[package]
name = "immersion"
version = "0.2.0"
description = "Immersion: a solo roleplaying and writing app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "immersion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8"
percent-encoding = "2.3"
